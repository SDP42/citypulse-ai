[project]
name = "citypulse"
version = "0.0.1"
description = "CityPulse AI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "shapely>=2.0",
  "pyproj>=3.6",
  "h3>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy / optional — each needs ADR + approval before install (blueprint 132)
scripts = ["osmium>=3.7"]
ml = ["scikit-learn>=1.5", "numpy>=1.26"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: needs explicit opt-in", "model: needs local model weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["citypulse*"]
